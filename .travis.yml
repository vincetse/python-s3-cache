sudo: required

services:
  - docker

language: python
python:
  - "2.7"
  - "pypy"

before_install:
  - docker pull lphoward/fake-s3
  - docker run -d --name my_s3 -p 4569:4569 -d lphoward/fake-s3
  - docker ps -a

# command to install dependencies
install:
  - pip install -r requirements.txt

script:
  - nosetests -v s3cache

after_script:
  - docker stop my_s3
  - docker rm -f my_s3
