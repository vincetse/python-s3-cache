sudo: required

language: python
python:
  - "2.7"
  - "pypy"

env:
  global:
    - S3_ENDPOINT=localhost
    - S3_PORT=4569

before_install:
  - gem install fakes3
  - fakes3 -r /tmp -p ${S3_PORT} &
  - netstat -ant

# command to install dependencies
install:
  - pip install -r requirements.txt

script:
  - nosetests -v s3cache

after_script:
  - kill %1
