sudo: required

services:
  - docker

language: python
python:
  - "2.7"
  - "pypy"

env:
  global:
    - S3_ENDPOINT=${DOCKER_HOST}
    - S3_PORT=4569

before_install:
  - docker pull lphoward/fake-s3
  - docker run -d --name my_s3 -p ${S3_PORT}:${S3_PORT} -d lphoward/fake-s3
  - docker ps -a
  - ifconfig -a

# command to install dependencies
install:
  - pip install -r requirements.txt

script:
  - nosetests -v s3cache

after_script:
  - docker stop my_s3
  - docker rm -f my_s3
